project:
  type: book
  output-dir: _book
  post-render:
    - python3 scripts/web/postprocess_html.py
  resources:
    - robots.txt

book:
  title: &publication-title "Advanced Computational Algorithms"
  subtitle: &publication-subtitle "Concepts, Complexity, and Applied Projects"
  author: &publication-author "Moody Amakobe"
  publisher: &publication-publisher "Global Data Science Institute"
  license: &publication-license "CC BY 4.0"
  date: &publication-date "2026-01-01"
  cover-image: images/cover.png
  description: >-
    A rigorous, implementation-minded open textbook on algorithm design,
    complexity, data structures, optimization, experimentation, and applied
    computational systems.
  site-url: https://proff-amakobe.github.io/oer-books/advanced-algorithms-book/
  repo-url: https://github.com/proff-amakobe/oer-books
  repo-subdir: advanced-algorithms-book
  repo-actions: [source, issue]
  downloads: [pdf, epub]
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: >-
      Advanced Computational Algorithms · Second Edition · 2026
    center: >-
      Moody Amakobe · Global Data Science Institute
    right: >-
      [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) ·
      [GitHub](https://github.com/proff-amakobe/oer-books/tree/main/advanced-algorithms-book)
  
  chapters:
    - index.qmd
    - title.qmd
    - edition.qmd
    - copyright.qmd
    - dedication.qmd
    - about-author.qmd
    - about-gdsi.qmd
    - how-to-use.qmd
  
    # Numbered chapters start here (Chapter 1)
    - part: "Part I: Foundations"
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-Divide-and-Conquer.qmd

    - part: "Part II: Core Techniques"
      chapters:
        - chapters/03-Data-Structures-for-Efficiency.qmd
        - chapters/04-Greedy-Algorithms.qmd
        - chapters/05-Dynamic-Programming.qmd
        - chapters/06-Randomized-Algorithms.qmd

    - part: "Part III: Complexity and Hard Problems"
      chapters:
        - chapters/07-Computational-Complexity.qmd
        - chapters/08-Approximation-Algorithms.qmd

    - part: "Part IV: Advanced Topics"
      chapters:
        - chapters/09-Advanced-Graph-Algorithms.qmd
        - chapters/10-String-Processing-Algorithms.qmd
        - chapters/11-Numerical-Algorithms.qmd
        - chapters/12-Advanced-Data-Structures.qmd

    - part: "Part V: Applications and Professional Practice"
      chapters:
        - chapters/13-Research-Industry-Applications.qmd
        - chapters/14-Project-Development.qmd
        - chapters/15-Final-Presentations.qmd

    - references.qmd

format:
  html:
    theme:
      - cosmo
      - styles/web.scss
    css:
      - styles/technical-blocks.css
    include-in-header:
      - includes/web-metadata.html
    include-after-body:
      - includes/web-accessibility.html
    filters:
      - filters/technical-blocks.lua
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    number-sections: true
    anchor-sections: true
    link-external-newwindow: true
    html-math-method: mathjax
    open-graph: true
    twitter-card: true

  pdf:
    documentclass: scrbook
    classoption:
      - open=any
    fontsize: 10.5pt
    geometry:
      - paperwidth=8.5in
      - paperheight=11in
      - top=0.76in
      - bottom=0.84in
      - inner=0.92in
      - outer=0.74in
    linestretch: 1.17
    include-in-header:
      - text: |
          \usepackage{setspace}
          \AtBeginEnvironment{verbatim}{\singlespacing}
          \usepackage{algorithm}
          \usepackage{algpseudocode}
      - print/technical-blocks.tex
      - print/preamble.tex
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    filters:
      - filters/format-numbering.lua
      - filters/technical-blocks.lua
      - filters/print-design.lua

  epub:
    css: styles/technical-blocks.css
    number-sections: true
    filters:
      - filters/format-numbering.lua
      - filters/technical-blocks.lua

lang: en-US
bibliography: references.bib

metadata:
  edition: "Second Edition"
  publication-year: "2026"
  print-isbn: "979-8-1827-2111-0"
  ebook-isbn: "TBD"
  publisher: *publication-publisher
  publisher-imprint: *publication-publisher
  license: *publication-license
  date: *publication-date
