th="88" height="36" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="350" y="225" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(1)</text><line x1="235" y1="89" x2="165" y2="126" stroke="#17324D" stroke-width="2.3"/><line x1="235" y1="89" x2="305" y2="126" stroke="#17324D" stroke-width="2.3"/><line x1="165" y1="164" x2="120" y2="201" stroke="#17324D" stroke-width="2.3"/><line x1="165" y1="164" x2="210" y2="201" stroke="#17324D" stroke-width="2.3"/><line x1="305" y1="164" x2="270" y2="201" stroke="#17324D" stroke-width="2.3"/><line x1="305" y1="164" x2="350" y2="201" stroke="#17324D" stroke-width="2.3"/><rect x="659.0" y="52.0" width="92" height="36" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="705" y="75" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(5)</text><rect x="659.0" y="112.0" width="92" height="36" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="705" y="135" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(4)</text><line x1="705" y1="89" x2="705" y2="111" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="659.0" y="172.0" width="92" height="36" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="705" y="195" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(3)</text><line x1="705" y1="149" x2="705" y2="171" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="659.0" y="232.0" width="92" height="36" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="705" y="255" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(2)</text><line x1="705" y1="209" x2="705" y2="231" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="604.0" y="292.0" width="92" height="36" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="650" y="315" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(1)</text><line x1="705" y1="269" x2="650" y2="291" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="714.0" y="292.0" width="92" height="36" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="760" y="315" font-size="13" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">fib(0)</text><line x1="650" y1="329" x2="760" y2="291" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><text x="235" y="300" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Repeated nodes recompute the same states</text><text x="705" y="365" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Each state is computed once; later requests are lookups</text></g></svg>