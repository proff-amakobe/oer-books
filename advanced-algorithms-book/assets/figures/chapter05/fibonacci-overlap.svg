<svg xmlns="http://www.w3.org/2000/svg" width="940" height="395" viewBox="0 0 940 395" role="img" aria-labelledby="title desc">
<title id="title">Overlapping Fibonacci subproblems</title><desc id="desc">Naive recursion repeats fib(3) and fib(2), while memoization computes a linear set of unique states.</desc>
