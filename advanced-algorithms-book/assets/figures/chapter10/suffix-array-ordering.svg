<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Suffix-array ordering for banana</title><desc id="desc">All suffixes of banana with a sentinel are ordered lexicographically to produce indices 6, 5, 3, 1, 0, 4, 2.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#17324D"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0F7C7B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202A33" stroke-linecap="round" stroke-linejoin="round"><text x="190" y="38" font-size="19" text-anchor="middle" font-weight="bold" fill="#2563A6" font-family="Arial, Helvetica, sans-serif">Suffixes of &quot;banana$&quot;</text><text x="650" y="38" font-size="19" text-anchor="middle" font-weight="bold" fill="#0F7C7B" font-family="Arial, Helvetica, sans-serif">Lexicographic order</text><rect x="80.0" y="66.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="87" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">banana$</text><rect x="80.0" y="108.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="129" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">anana$</text><rect x="80.0" y="150.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="171" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">nana$</text><rect x="80.0" y="192.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="213" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">ana$</text><rect x="80.0" y="234.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="255" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">na$</text><rect x="80.0" y="276.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="297" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">a$</text><rect x="80.0" y="318.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="190" y="339" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">$</text><rect x="540.0" y="66.0" width="220" height="32" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="650" y="87" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">$  →  6</text><line x1="315" y1="334" x2="525" y2="82" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="540.0" y="108.0" width="220" height="32" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="650" y="129" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">a$  →  5</text><line x1="315" y1="292" x2="525" y2="124" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="540.0" y="150.0" width="220" height="32" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="650" y="171" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">ana$  →  3</text><line x1="315" y1="208" x2="525" y2="166" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="540.0" y="192.0" width="220" height="32" rx="9" fill="#D9F1EF" stroke="#0F7C7B" stroke-width="2.4" /><text x="650" y="213" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">anana$  →  1</text><line x1="315" y1="124" x2="525" y2="208" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="540.0" y="234.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="650" y="255" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">banana$  →  0</text><line x1="315" y1="82" x2="525" y2="250" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="540.0" y="276.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="650" y="297" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">na$  →  4</text><line x1="315" y1="250" x2="525" y2="292" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="540.0" y="318.0" width="220" height="32" rx="9" fill="#EEF3F7" stroke="#17324D" stroke-width="2.4" /><text x="650" y="339" font-size="14" text-anchor="middle" font-weight="normal" fill="#202A33" font-family="Arial, Helvetica, sans-serif">nana$  →  2</text><line x1="315" y1="166" x2="525" y2="334" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><text x="650" y="390" font-size="18" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Suffix array = [6, 5, 3, 1, 0, 4, 2]</text></g></svg>