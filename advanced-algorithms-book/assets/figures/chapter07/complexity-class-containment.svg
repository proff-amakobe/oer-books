<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Known complexity-class containments</title><desc id="desc">Nested regions show P inside NP inside PSPACE inside EXP, while explicitly marking P versus NP as open.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#17324D"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0F7C7B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202A33" stroke-linecap="round" stroke-linejoin="round"><rect x="45" y="35" width="810" height="330" rx="28" fill="#EEF3F7" stroke="#17324D" stroke-width="3"/><text x="85" y="70" font-size="20" text-anchor="start" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">EXP</text><rect x="120" y="85" width="660" height="240" rx="24" fill="white" stroke="#2563A6" stroke-width="3"/><text x="155" y="120" font-size="19" text-anchor="start" font-weight="bold" fill="#2563A6" font-family="Arial, Helvetica, sans-serif">PSPACE</text><ellipse cx="450" cy="215" rx="245" ry="90" fill="#E8F5F4" stroke="#0F7C7B" stroke-width="3"/><text x="650" y="160" font-size="19" text-anchor="middle" font-weight="bold" fill="#0F7C7B" font-family="Arial, Helvetica, sans-serif">NP</text><ellipse cx="345" cy="215" rx="105" ry="58" fill="#FFF1D3" stroke="#C88719" stroke-width="3"/><text x="345" y="221" font-size="22" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">P</text><text x="450" y="402" font-size="18" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Known: P ⊆ NP ⊆ PSPACE ⊆ EXP. Whether P = NP remains open.</text></g></svg>