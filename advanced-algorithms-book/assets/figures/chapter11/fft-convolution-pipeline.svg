"655" y1="145" x2="700" y2="145" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><text x="450" y="55" font-size="21" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Polynomial multiplication via the convolution theorem</text><text x="450" y="265" font-size="17" text-anchor="middle" font-weight="bold" fill="#0F7C7B" font-family="Arial, Helvetica, sans-serif">Two transforms + linear pointwise multiplication + inverse transform</text></g></svg>