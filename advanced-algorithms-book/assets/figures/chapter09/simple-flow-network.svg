<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
<title id="title">A two-path flow network</title><desc id="desc">Two source-to-sink paths carry 10 and 5 units, achieving a maximum flow of 15.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#17324D"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0F7C7B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202A33" stroke-linecap="round" stroke-linejoin="round"><circle cx="90" cy="180" r="27" fill="#17324D" stroke="#17324D" stroke-width="2.5"/><text x="90" y="186" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif">s</text><circle cx="360" cy="80" r="27" fill="#EEF3F7" stroke="#17324D" stroke-width="2.5"/><text x="360" y="86" font-size="17" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">a</text><circle cx="360" cy="280" r="27" fill="#EEF3F7" stroke="#17324D" stroke-width="2.5"/><text x="360" y="286" font-size="17" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">b</text><circle cx="700" cy="180" r="27" fill="#0F7C7B" stroke="#0F7C7B" stroke-width="2.5"/><text x="700" y="186" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif">t</text><line x1="117" y1="170" x2="332" y2="92" stroke="#0F7C7B" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="200.5" y="102.0" width="48" height="24" rx="5" fill="white"/><text x="224.5" y="119.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">10</text><line x1="117" y1="190" x2="332" y2="268" stroke="#0F7C7B" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="200.5" y="200.0" width="48" height="24" rx="5" fill="white"/><text x="224.5" y="217.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">5</text><line x1="388" y1="92" x2="673" y2="170" stroke="#0F7C7B" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="506.5" y="102.0" width="48" height="24" rx="5" fill="white"/><text x="530.5" y="119.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">10</text><line x1="388" y1="268" x2="673" y2="190" stroke="#0F7C7B" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="506.5" y="200.0" width="48" height="24" rx="5" fill="white"/><text x="530.5" y="217.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">15</text><text x="450" y="355" font-size="18" text-anchor="middle" font-weight="bold" fill="#0F7C7B" font-family="Arial, Helvetica, sans-serif">Maximum flow = 10 on s→a→t plus 5 on s→b→t = 15</text></g></svg>