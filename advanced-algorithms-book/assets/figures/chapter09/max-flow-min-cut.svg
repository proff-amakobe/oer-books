e x1="328" y1="263" x2="662" y2="192" stroke="#0F7C7B" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="471.0" y="198.5" width="48" height="24" rx="5" fill="white"/><text x="495.0" y="215.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">5/15</text><line x1="190" y1="45" x2="190" y2="320" stroke="#C88719" stroke-width="4" stroke-dasharray="10 7"/><text x="210" y="65" font-size="16" text-anchor="start" font-weight="bold" fill="#C88719" font-family="Arial, Helvetica, sans-serif">minimum cut</text><text x="400" y="355" font-size="16" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">The source cut crosses capacities 10 and 5, matching the flow value 15</text></g></svg>