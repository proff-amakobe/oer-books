<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
<title id="title">Residual capacities for a partially used edge</title><desc id="desc">An edge carrying seven of ten units leaves three forward residual units and seven backward cancellation units.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#17324D"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0F7C7B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202A33" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="155" r="28" fill="#17324D" stroke="#17324D" stroke-width="2.5"/><text x="180" y="161" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif">u</text><circle cx="620" cy="155" r="28" fill="#0F7C7B" stroke="#0F7C7B" stroke-width="2.5"/><text x="620" y="161" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif">v</text><line x1="210" y1="140" x2="590" y2="140" stroke="#17324D" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="376.0" y="109.0" width="48" height="24" rx="5" fill="white"/><text x="400.0" y="126.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">3</text><line x1="590" y1="185" x2="210" y2="185" stroke="#0F7C7B" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/><rect x="376.0" y="187.0" width="48" height="24" rx="5" fill="white"/><text x="400.0" y="204.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">7</text><text x="400" y="72" font-size="20" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Original edge carries 7/10</text><text x="400" y="245" font-size="17" text-anchor="middle" font-weight="bold" fill="#202A33" font-family="Arial, Helvetica, sans-serif">Forward residual capacity 3; backward cancellation capacity 7</text></g></svg>