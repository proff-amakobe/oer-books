project:
  type: book
  output-dir: _book
  post-render: scripts/seo-post-render.rb
  resources:
    - assets/**
    - robots.txt
    - 404.html

# lang at the top level sets the xml:lang and dc:language metadata in
# the EPUB OPF file. Without this Quarto inherits the system locale,
# which on many Unix/macOS systems is "C" — not a valid BCP-47 language
# tag and the direct cause of the OPF-092 validation errors.
lang: en

profile:
  default: digital
  group:
    - [digital, print, volume1, volume2]

book:
  title: "The Complete Software Engineering Lifecycle"
  subtitle: "Methods, Patterns, and Implementation"
  author: "Moody Amakobe"
  publisher: "Global Data Science Institute"
  license: "CC BY 4.0"
  date: "2026-01-01"
  date-format: "YYYY"
  description: "A comprehensive, project-driven software engineering textbook covering requirements, modeling, architecture, UI/UX, Agile development, version control, testing, CI/CD, data management, cloud deployment, security, maintenance, professional practice, and full lifecycle integration."
  site-url: "https://proff-amakobe.github.io/oer-books/se_lifecycle_book/"
  repo-url: "https://github.com/proff-amakobe/oer-books"
  repo-subdir: "se_lifecycle_book"
  repo-actions: [edit, issue]
  cover-image: assets/images/cover.png
  favicon: assets/images/cover.png
  page-navigation: true
  search: true
  downloads: [pdf, epub]
  open-graph:
    image: "https://proff-amakobe.github.io/oer-books/se_lifecycle_book/assets/images/cover.png"
  twitter-card:
    image: "https://proff-amakobe.github.io/oer-books/se_lifecycle_book/assets/images/cover.png"
  page-footer:
    left: "The Complete Software Engineering Lifecycle · 2026 Edition"
    center: "Moody Amakobe · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    right:
      - text: "GitHub"
        href: "https://github.com/proff-amakobe/oer-books/tree/main/se_lifecycle_book"
      - text: "Sitemap"
        href: "sitemap.xml"
bibliography: references.bib

editor: visual
