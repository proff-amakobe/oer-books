project:
  type: book
  output-dir: _book
  resources:
    - assets/**

book:
  title: "The Complete Software Engineering Lifecycle"
  subtitle: "Methods, Patterns, and Implementation"
  author: "Moody Amakobe"
  publisher: "Global Data Science Institute"
  license: "CC BY 4.0"
  date: today
  cover-image: images/cover.png
  chapters:
    - index.qmd
    - preface.qmd
    - acknowledgments.qmd
    - chapters/01-introduction.qmd
    - chapters/02-requirements-engineering.qmd
    - chapters/03-systems-modeling.qmd
    - chapters/04-software-architecture.qmd
    - chapters/05-ui-ux.qmd
    - chapters/06-agile-methodologies.qmd
    - chapters/07-version-control.qmd
    - chapters/08-testing-quality.qmd
    - chapters/09-cicd.qmd
    - chapters/10-data-management.qmd
    - chapters/11-cloud-services.qmd
    - chapters/12-security.qmd
    - chapters/13-maintenance-evolution.qmd
    - chapters/14-ethics-professionalism.qmd
    - chapters/15-final-project-integration.qmd
    - chapters/glossary.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    number-sections: true

  pdf:
    documentclass: scrbook
    pdf-engine: lualatex

    # --- CLRS-like textbook trim ---
    papersize: "8.5in,11in"

    fontsize: 11pt
    linestretch: 1.12

    # --- KDP safe margins for thick books (still generous) ---
    geometry:
      - paperwidth=8.5in
      - paperheight=11in
      - inner=1.15in
      - outer=0.85in
      - top=0.85in
      - bottom=0.9in
      - includeheadfoot

    toc: true
    toc-depth: 3
    number-sections: true

    colorlinks: true
    linkcolor: GDSIBlue
    urlcolor: GDSIBlue

    # Figures: keep them inside margins; allow wider content on 8.5x11
    fig-align: center
    fig-width: 7.0

    include-in-header:
      text: |
        % ---------- FONTS (KDP-safe) ----------
        \usepackage[T1]{fontenc}
        \usepackage{lmodern}
        \usepackage{microtype}

        % ---------- BRAND COLOR ----------
        \usepackage{xcolor}
        \definecolor{GDSIBlue}{HTML}{008FA1}

        % ---------- SECTION/CHAPTER COLOR ----------
        \usepackage{sectsty}
        \chapterfont{\color{GDSIBlue}}
        \sectionfont{\color{GDSIBlue}}
        \subsectionfont{\color{GDSIBlue}}

        % ---------- CHAPTER TITLE FORMAT (avoid wrapping) ----------
        \usepackage{titlesec}
        \titleformat{\chapter}[display]
          {\normalfont\bfseries\LARGE\color{GDSIBlue}} % was Huge; reduced to prevent wrap
          {\chaptername\ \thechapter}{14pt}{\LARGE}

        % Tighter spacing around chapter titles (reduces page count too)
        \titlespacing*{\chapter}{0pt}{-5pt}{18pt}

        % ---------- GRAPHICS: never exceed text area ----------
        \usepackage{graphicx}
        \setkeys{Gin}{width=\linewidth,height=0.9\textheight,keepaspectratio}

        % ---------- TABLES ----------
        \usepackage{colortbl}
        \rowcolors{2}{GDSIBlue!5}{white}
        \usepackage{adjustbox}

        % ---------- CALLOUT BOX ----------
        \usepackage{tcolorbox}
        \newtcolorbox{gdsiNote}{
          colback=GDSIBlue!10,
          colframe=GDSIBlue!70!black,
          title=Key Insight,
          fonttitle=\bfseries
        }

        % ---------- ALGORITHMS ----------
        \usepackage{algorithm}
        \usepackage{algpseudocode}

  epub:
    number-sections: true

editor: visual
