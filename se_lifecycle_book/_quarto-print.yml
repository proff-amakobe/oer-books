project:
  output-dir: _book
  post-render: []

title: ""
author: ""
date: ""

book:
  output-file: The-Complete-Software-Engineering-Lifecycle-Print
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-requirements-engineering.qmd
    - chapters/03-systems-modeling.qmd
    - chapters/04-software-architecture.qmd
    - chapters/05-ui-ux.qmd
    - chapters/06-agile-methodologies.qmd
    - chapters/07-version-control.qmd
    - chapters/08-testing-quality.qmd
    - chapters/09-cicd.qmd
    - chapters/10-data-management.qmd
    - chapters/11-cloud-services.qmd
    - chapters/12-security.qmd
    - chapters/13-maintenance-evolution.qmd
    - chapters/14-ethics-professionalism.qmd
    - chapters/15-final-project-integration.qmd
    - chapters/glossary.qmd

format:
  pdf:
    documentclass: scrbook
    classoption: [twoside, openany, cleardoublepage=empty]
    pdf-engine: lualatex
    latex-min-runs: 2
    papersize: letter
    fontsize: 10.15pt
    linestretch: 1.22
    toc: false
    number-sections: true
    number-depth: 2
    colorlinks: true
    linkcolor: SEText
    urlcolor: SEDeepBlue
    citecolor: SEText
    fig-align: center
    fig-pos: "htbp"
    keep-tex: true
    filters:
      - print/filters/print-components.lua
    include-in-header: print/preamble.tex
