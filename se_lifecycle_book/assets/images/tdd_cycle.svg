<text x="340" y="290" text-anchor="middle" font-family="var(--font-sans)" font-size="15" font-weight="600" fill="#185FA5" style="fill:rgb(24, 95, 165);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:auto">3. REFACTOR</text>
