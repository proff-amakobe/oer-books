<!-- === RED box (top left) === -->
<rect x="60" y="40" width="200" height="110" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="160" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="15" font-weight="600" fill="#A32D2D" style="fill:rgb(163, 45, 45);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:auto">1. RED</text>
<text x="160" y="102" text-anchor="middle" font-family="var(--font-sans)" font-size="13" fill="#501313" style="fill:rgb(80, 19, 19);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Write a failing test</text>
<text x="160" y="120" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#791F1F" style="fill:rgb(121, 31, 31);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">that defines desired</text>
<text x="160" y="136" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#791F1F" style="fill:rgb(121, 31, 31);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">behaviour</text>

<!-- === GREEN box (top right) === -->
<rect x="420" y="40" width="200" height="110" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2" style="fill:rgb(234, 243, 222);stroke:rgb(59, 109, 17);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="520" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="15" font-weight="600" fill="#3B6D11" style="fill:rgb(59, 109, 17);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:auto">2. GREEN</text>
