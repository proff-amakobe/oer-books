<text x="520" y="120" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#27500A" style="fill:rgb(39, 80, 10);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">to make the test</text>
<text x="520" y="136" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#27500A" style="fill:rgb(39, 80, 10);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">pass</text>

