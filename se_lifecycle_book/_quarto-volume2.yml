project:
  output-dir: output/volume2
  post-render: []

title: ""
author: ""
date: ""

book:
  title: "Software Delivery, Operations, and Evolution"
  subtitle: "The Complete Software Engineering Lifecycle — Volume II"
  author: "Moody Amakobe"
  publisher: "Global Data Science Institute"
  date: "2026-01-01"
  output-file: Software-Delivery-Operations-and-Evolution
  chapters:
    - index.qmd
    - frontmatter/volume2/frontmatter.qmd
    - part: "Delivery and Integration"
      chapters:
        - chapters/09-cicd.qmd
        - chapters/10-data-management.qmd
    - part: "Production Systems"
      chapters:
        - chapters/11-cloud-services.qmd
        - chapters/12-security.qmd
    - part: "Evolution and Professional Practice"
      chapters:
        - chapters/13-maintenance-evolution.qmd
        - chapters/14-ethics-professionalism.qmd
        - chapters/15-final-project-integration.qmd

volume-number: 2
series-title: "The Complete Software Engineering Lifecycle"
series-number: 2
print-isbn: "979-8-2408-9370-4"
ebook-isbn: "TBD"
keywords:
  - software engineering
  - DevOps
  - CI/CD
  - continuous integration
  - continuous deployment
  - cloud computing
  - Docker
  - Kubernetes
  - APIs
  - REST APIs
  - software security
  - infrastructure as code
  - software maintenance
  - technical debt
  - software operations

format:
  pdf:
    documentclass: scrbook
    classoption: [twoside, openany, cleardoublepage=empty]
    pdf-engine: lualatex
    latex-min-runs: 2
    papersize: letter
    fontsize: 10.15pt
    linestretch: 1.22
    toc: false
    number-sections: true
    number-depth: 2
    colorlinks: true
    linkcolor: SEText
    urlcolor: SEDeepBlue
    citecolor: SEText
    fig-align: center
    fig-pos: "htbp"
    keep-tex: true
    filters:
      - filters/volume-content.lua
      - print/filters/print-components.lua
      - filters/volume-crossrefs.lua
    include-in-header:
      - print/preamble.tex
      - print/volume2-preamble.tex
  epub:
    toc: true
    number-sections: true
    epub-chapter-level: 1
    filters:
      - filters/volume-content.lua
      - filters/volume-crossrefs.lua
