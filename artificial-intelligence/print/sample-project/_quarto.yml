project:
  type: default
  output-dir: ../../tmp/pdfs/sample

format:
  pdf:
    output-file: Engineering-Intelligent-Systems-Print-Sample.pdf
    pdf-engine: lualatex
    documentclass: scrbook
    classoption: [twoside, openright, 10.5pt]
    papersize: letter
    geometry:
      - inner=0.92in
      - outer=0.76in
      - top=0.76in
      - bottom=0.84in
      - bindingoffset=0.08in
      - headheight=16pt
      - headsep=18pt
      - footskip=28pt
    toc: false
    titlepage: false
    number-sections: true
    keep-tex: true
    highlight-style: breeze
    include-in-header:
      - ../colors.tex
      - ../typography.tex
      - ../page-layout.tex
      - ../chapter-style.tex
      - ../content-style.tex
    include-before-body: ../before-body.tex
    include-after-body: ../after-body.tex

filters:
  - ../filters/print-layout.lua
