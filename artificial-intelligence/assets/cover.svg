<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Intelligent Systems book cover</title>
  <desc id="desc">A dark navy technical book cover with a restrained cyan architectural network and circuit motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.62" stop-color="#0b2842"/>
      <stop offset="1" stop-color="#10395a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21b8e6"/>
      <stop offset="1" stop-color="#78d7f2"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#77cbe7" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="2560" fill="url(#background)"/>
  <rect width="1600" height="2560" fill="url(#grid)"/>
  <rect x="104" y="118" width="12" height="2324" rx="6" fill="url(#accent)"/>

  <g fill="none" stroke="#31bde9" stroke-opacity="0.62" stroke-width="4">
    <path d="M860 1040H1120L1240 920H1450"/>
    <path d="M780 1210H1010L1160 1360H1450"/>
    <path d="M880 1510H1110L1240 1635H1450"/>
    <path d="M1010 1210V1040"/>
    <path d="M1110 1510V1360"/>
    <path d="M1240 920V690H1450"/>
    <path d="M1240 1635V1880H1450"/>
  </g>
  <g fill="#49c9ee">
    <circle cx="860" cy="1040" r="12"/>
    <circle cx="1120" cy="1040" r="12"/>
    <circle cx="1240" cy="920" r="12"/>
    <circle cx="780" cy="1210" r="12"/>
    <circle cx="1010" cy="1210" r="12"/>
    <circle cx="1160" cy="1360" r="12"/>
    <circle cx="880" cy="1510" r="12"/>
    <circle cx="1110" cy="1510" r="12"/>
    <circle cx="1240" cy="1635" r="12"/>
  </g>
  <g fill="#30bce8" opacity="0.15" filter="url(#softGlow)">
    <circle cx="1010" cy="1210" r="58"/>
    <circle cx="1160" cy="1360" r="58"/>
    <circle cx="1240" cy="920" r="58"/>
  </g>

  <text x="190" y="300" fill="#79d8f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="8">FIRST OPEN EDITION · 2026</text>
  <text x="190" y="570" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="142" font-weight="700" letter-spacing="-3">
    <tspan x="190" dy="0">Engineering</tspan>
    <tspan x="190" dy="165">Intelligent</tspan>
    <tspan x="190" dy="165">Systems</tspan>
  </text>
  <rect x="190" y="970" width="500" height="9" rx="4" fill="url(#accent)"/>
  <text x="190" y="1090" fill="#c9e7f2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="400">
    <tspan x="190" dy="0">Designing, Building, and Deploying</tspan>
    <tspan x="190" dy="76">Modern Artificial Intelligence</tspan>
  </text>

  <g transform="translate(190 1760)">
    <rect width="540" height="300" rx="24" fill="#0d304e" stroke="#3bbfe8" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M70 150H190L250 90H365L430 150" fill="none" stroke="#55cbed" stroke-width="5"/>
    <path d="M70 150H190L250 210H365L430 150" fill="none" stroke="#55cbed" stroke-width="5"/>
    <g fill="#8de1f6">
      <circle cx="70" cy="150" r="12"/><circle cx="190" cy="150" r="12"/><circle cx="250" cy="90" r="12"/>
      <circle cx="250" cy="210" r="12"/><circle cx="365" cy="90" r="12"/><circle cx="365" cy="210" r="12"/><circle cx="430" cy="150" r="12"/>
    </g>
  </g>

  <text x="190" y="2260" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="65" font-weight="600">Moody Amakobe</text>
  <text x="190" y="2335" fill="#83cfe8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" letter-spacing="4">OPEN EDUCATIONAL RESOURCE · CC BY 4.0</text>
