project:
  output-dir: _book

book:
  output-file: Engineering-Intelligent-Systems-Print

format:
  pdf:
    cover-image: null
    pdf-engine: lualatex
    documentclass: scrbook
    classoption:
      - twoside
      - openright
      - 10.5pt
    papersize: letter
    geometry:
      - inner=0.92in
      - outer=0.76in
      - top=0.76in
      - bottom=0.84in
      - bindingoffset=0.08in
      - headheight=16pt
      - headsep=18pt
      - footskip=28pt
    toc: false
    titlepage: false
    number-sections: true
    colorlinks: true
    linkcolor: EISDeepBlue
    urlcolor: EISDeepBlue
    citecolor: EISDeepBlue
    keep-tex: true
    highlight-style: breeze
    include-in-header:
      - print/colors.tex
      - print/typography.tex
      - print/page-layout.tex
      - print/chapter-style.tex
      - print/content-style.tex
    include-before-body: print/before-body.tex
    include-after-body: print/after-body.tex

filters:
  - print/filters/print-layout.lua
