project:
  type: book
  output-dir: _book

book:
  title: "Artificial Intelligence"
  subtitle: "Foundations, Methods, Applications, and Responsible Practice"
  author: "Author to be confirmed"
  description: "An open textbook introducing the foundations, methods, applications, deployment, and societal dimensions of artificial intelligence."
  license: "CC BY 4.0"
  repo-url: https://github.com/proff-amakobe/oer-books
  repo-subdir: artificial-intelligence
  repo-actions: [edit, issue]
  site-url: https://proff-amakobe.github.io/oer-books/artificial-intelligence/
  chapters:
    - index.qmd
    - preface.qmd
    - part: "Foundations and Classical AI"
      chapters:
        - chapters/01-ai-foundations.md
        - chapters/02-search.md
        - chapters/03-knowledge-representation.md
        - chapters/04-planning.md
        - chapters/05-uncertainty.md
    - part: "Machine Learning"
      chapters:
        - chapters/06-supervised-learning.md
        - chapters/07-unsupervised-learning.md
        - chapters/08-neural-networks.md
    - part: "Perception and Interaction"
      chapters:
        - chapters/09-natural-language-processing.md
        - chapters/10-computer-vision.md
        - chapters/11-reinforcement-learning.md
    - part: "Systems and Contemporary AI"
      chapters:
        - chapters/12-expert-systems.md
        - chapters/13-generative-ai.md
        - chapters/14-ethics.md
        - chapters/15-mlops-deployment.md
        - chapters/16-future-directions.md
    - references.qmd

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true
  epub:
    toc: true
  pdf:
    documentclass: scrreprt
    toc: true

execute:
  freeze: auto
  enabled: false

lang: en
