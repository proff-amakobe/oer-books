project:
  type: book
  output-dir: _book

book:
  title: "Engineering Intelligent Systems"
  subtitle: "Designing, Building, and Deploying Modern Artificial Intelligence"
  author: "Moody Amakobe"
  date: "2026"
  description: "A systems-oriented open textbook connecting artificial intelligence theory, implementation, deployment, and responsible practice."
  license: "CC BY 4.0"
  cover-image: assets/cover.png
  cover-image-alt: "Cover of Engineering Intelligent Systems with an abstract blue architectural systems network"
  favicon: assets/favicon.svg
  site-url: https://proff-amakobe.github.io/oer-books/artificial-intelligence/
  repo-url: https://github.com/proff-amakobe/oer-books
  repo-subdir: artificial-intelligence
  repo-actions: [edit, issue]
  downloads: [pdf, epub]
  page-navigation: true
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Engineering Intelligent Systems · First Open Edition · 2026"
    right:
      - text: "CC BY 4.0"
        href: https://creativecommons.org/licenses/by/4.0/
      - text: "Citation"
        href: frontmatter/citation.qmd
      - text: "GitHub"
        href: https://github.com/proff-amakobe/oer-books/tree/main/artificial-intelligence
  chapters:
    - index.qmd
    - frontmatter/preface.qmd
    - frontmatter/how-to-use.qmd
    - part: parts/01-foundations.qmd
      chapters:
        - chapters/01-ai-foundations.md
    - part: parts/02-reasoning.qmd
      chapters:
        - chapters/02-search.md
        - chapters/03-knowledge-representation.md
        - chapters/04-planning.md
        - chapters/05-uncertainty.md
    - part: parts/03-learning.qmd
      chapters:
        - chapters/06-supervised-learning.md
        - chapters/07-unsupervised-learning.md
        - chapters/08-neural-networks.md
    - part: parts/04-perception-generative.qmd
      chapters:
        - chapters/09-natural-language-processing.md
        - chapters/10-computer-vision.md
        - chapters/11-reinforcement-learning.md
        - chapters/12-expert-systems.md
        - chapters/13-generative-ai.md
    - part: parts/05-engineering-responsibility.qmd
      chapters:
        - chapters/14-ethics.md
        - chapters/15-mlops-deployment.md
        - chapters/16-future-directions.md
    - references.qmd
    - frontmatter/about-author.qmd
    - frontmatter/oer.qmd
    - frontmatter/copyright.qmd
    - frontmatter/citation.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true
    open-graph:
      image: assets/cover.png
      description: "A systems-oriented open textbook for designing, building, and deploying modern artificial intelligence."
    twitter-card:
      image: assets/cover.png
      description: "A systems-oriented open textbook for designing, building, and deploying modern artificial intelligence."
  epub:
    toc: true
    cover-image: assets/cover.png
  pdf:
    documentclass: scrreprt
    toc: true
    cover-image: assets/cover.png

execute:
  freeze: auto
  enabled: false

lang: en
