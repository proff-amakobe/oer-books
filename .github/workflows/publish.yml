name: Build & Publish Books
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install SVG → PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin poppler-utils qpdf fonts-dejavu-core


      - name: Install new Generative AI review dependencies
        run: |
          # Quarto installs TinyTeX without adding its binary directory to PATH.
          tex_bin="$(find "$HOME/.TinyTeX/bin" -name tlmgr -type f -o -name tlmgr -type l | head -n 1)"
          test -n "$tex_bin"
          "$tex_bin" install tex-gyre fvextra newunicodechar needspace wrapfig
          python -m pip install -r Generative-AI/scripts/qa/requirements.txt

      - name: Render books
        run: |
          set -e

          # ---- Advanced Algorithms Book ----
          cd advanced-algorithms-book
          quarto render
          cd ..

          # ---- Software Engineering Lifecycle Book ----
          cd se_lifecycle_book
          quarto render
          cd ..

          # ---- Introduction to GenAI Book ----
          cd intro-genai-llm-oer-book
          quarto render
          cd ..

          # ---- Artificial Intelligence Book ----
          cd artificial-intelligence
          quarto render
          cd ..

          # ---- Deep Learning Book (HTML is the deployed edition) ----
          cd deep-learning
          quarto render --to html
          cd ..

          

          # ---- Generative AI: independent fifteen-chapter book ----
          cd Generative-AI
          python3 scripts/build.py
          python3 scripts/lock_original.py --ci
          python3 scripts/qa/verify_original.py
          pdfinfo output/reset/pdf/Generative-AI-ORIGINAL-MANUSCRIPT-REVIEW.pdf
          pdffonts output/reset/pdf/Generative-AI-ORIGINAL-MANUSCRIPT-REVIEW.pdf
          qpdf --check output/reset/pdf/Generative-AI-ORIGINAL-MANUSCRIPT-REVIEW.pdf
          cd ..

          # ---- Prepare public directory ----
          rm -rf public && mkdir -p public

          # Copy Advanced Algorithms Book
          mkdir -p public/advanced-algorithms-book
          cp -r advanced-algorithms-book/_book/* public/advanced-algorithms-book/

          # Copy Software Engineering Lifecycle Book
          mkdir -p public/se_lifecycle_book
          cp -r se_lifecycle_book/_book/* public/se_lifecycle_book/

          # Copy Introduction to GenAI Book
          mkdir -p public/intro-genai-llm-oer-book
          cp -r intro-genai-llm-oer-book/_book/* public/intro-genai-llm-oer-book/

          # Copy Artificial Intelligence Book
          mkdir -p public/artificial-intelligence
          cp -r artificial-intelligence/_book/* public/artificial-intelligence/

          # Copy Deep Learning Book
          mkdir -p public/deep-learning
          cp -r deep-learning/_book/* public/deep-learning/

          # Copy Generative AI, including PDF and EPUB downloads
          mkdir -p public/Generative-AI
          cp -r Generative-AI/output/reset/html/* public/Generative-AI/

          echo "----- Deployed tree -----"
          ls -R public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
