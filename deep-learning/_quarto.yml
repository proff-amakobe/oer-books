project:
  type: book
  output-dir: _book

book:
  title: "Deep Learning: A Comprehensive Guide"
  description: "An open textbook covering deep learning foundations, architectures, generative systems, deployment, and responsible practice."
  license: "CC BY 4.0"
  site-url: https://proff-amakobe.github.io/oer-books/deep-learning/
  repo-url: https://github.com/proff-amakobe/oer-books
  repo-subdir: deep-learning
  repo-actions: [edit, issue]
  page-navigation: true
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Deep Learning: A Comprehensive Guide · Open Educational Resource"
    right:
      - text: "CC BY 4.0"
        href: https://creativecommons.org/licenses/by/4.0/
      - text: "GitHub"
        href: https://github.com/proff-amakobe/oer-books/tree/main/deep-learning
  chapters:
    - index.qmd
    - frontmatter/preface.qmd
    - frontmatter/how-to-use.qmd
    - part: parts/01-foundations.qmd
      chapters:
        - chapters/01-introduction-to-deep-learning.qmd
        - chapters/02-neural-network-architectures.qmd
        - chapters/03-training-fundamentals.qmd
    - part: parts/02-vision-systems.qmd
      chapters:
        - chapters/04-architecture-of-sight.qmd
        - chapters/05-visual-tasks-beyond-classification.qmd
        - chapters/06-evaluating-the-vision-pipeline.qmd
    - part: parts/03-sequence-language-multimodal.qmd
      chapters:
        - chapters/07-sequence-models.qmd
        - chapters/08-transformers.qmd
        - chapters/09-pretrained-language-models.qmd
        - chapters/10-multimodal-systems.qmd
    - part: parts/04-generative-adaptive.qmd
      chapters:
        - chapters/11-vaes-and-gans.qmd
        - chapters/12-diffusion-models.qmd
        - chapters/13-reinforcement-learning.qmd
    - part: parts/05-engineering-responsibility.qmd
      chapters:
        - chapters/14-deployment-and-production.qmd
        - chapters/15-ai-at-scale.qmd
        - chapters/16-ethics-and-futures.qmd
    - references.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true
  epub:
    toc: true
  pdf:
    documentclass: scrreprt
    toc: true

execute:
  enabled: false

lang: en

