project:
  output-dir: _book

book:
  output-file: Deep-Learning-A-Comprehensive-Guide-Print

format:
  pdf:
    cover-image: null
    pdf-engine: lualatex
    documentclass: scrbook
    classoption:
      - twoside
      - openright
      - 10.5pt
    papersize: letter
    geometry:
      - inner=0.92in
      - outer=0.76in
      - top=0.76in
      - bottom=0.86in
      - bindingoffset=0.12in
      - headheight=16pt
      - headsep=18pt
      - footskip=27pt
    toc: false
    toc-depth: 1
    titlepage: false
    number-sections: true
    colorlinks: true
    linkcolor: DLIndigo
    urlcolor: DLIndigo
    citecolor: DLIndigo
    keep-tex: true
    highlight-style: breeze
    include-in-header:
      - print/colors.tex
      - print/typography.tex
      - print/page-layout.tex
      - print/structure.tex
      - print/content.tex
    include-before-body: print/before-body.tex
    include-after-body: print/after-body.tex

filters:
  - print/filters/print-layout.lua
