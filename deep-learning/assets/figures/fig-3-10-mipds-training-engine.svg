<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MIPDS vision training engine with augmentation, model, loss, optimizer, validation, schedule, and checkpoints</title><desc id="desc">MIPDS vision training engine with augmentation, model, loss, optimizer, validation, schedule, and checkpoints</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#081B33"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#081B33}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#5B6678}.axis{stroke:#5B6678;stroke-width:2}.grid{stroke:#D8DEE8;stroke-width:1}.flow{stroke:#081B33;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.panel{fill:#F4F7FA;stroke:#AAB3C0;stroke-width:2}.module{fill:#E8EEF8;stroke:#263F8F;stroke-width:2}.accent{fill:#DDF4F8;stroke:#238BA8;stroke-width:2}</style></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="48" class="t" text-anchor="middle">MIPDS Week 3: Structure + Training Engine</text>
<rect x="35" y="90" width="1530" height="470" rx="12" fill="#F4F7FA" stroke="#AAB3C0" stroke-width="2"/>
<text x="70" y="128" class="h" text-anchor="start">TRAINING-TIME SYSTEM</text>
<rect x="75" y="230" width="210" height="110" rx="12" fill="#F4F7FA" stroke="#5B6678" stroke-width="2"/>
<text x="180.0" y="270" class="h" text-anchor="middle">TRAINING IMAGES</text>
<text x="180.0" y="303" class="s" text-anchor="middle">labeled mini-batches</text>
<rect x="345" y="230" width="230" height="110" rx="12" fill="#DDF4F8" stroke="#29A7C8" stroke-width="2"/>
<text x="460.0" y="270" class="h" text-anchor="middle">DATA AUGMENTATION</text>
<text x="460.0" y="303" class="s" text-anchor="middle">flip · crop · color jitter</text>
<rect x="640" y="200" width="260" height="170" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="770.0" y="240" class="h" text-anchor="middle">VISION MODEL</text>
<text x="770.0" y="273" class="s" text-anchor="middle">convolutional features</text>
<text x="770.0" y="297" class="s" text-anchor="middle">Dropout after dense layers</text>
<rect x="970" y="200" width="220" height="170" rx="12" fill="#F4F7FA" stroke="#5B6678" stroke-width="2"/>
<text x="1080.0" y="240" class="h" text-anchor="middle">CROSS-ENTROPY LOSS</text>
<text x="1080.0" y="273" class="s" text-anchor="middle">class-weighted if needed</text>
<rect x="1260" y="200" width="230" height="170" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="1375.0" y="240" class="h" text-anchor="middle">ADAM / ADAMW</text>
<text x="1375.0" y="273" class="s" text-anchor="middle">updates model weights</text>
<line x1="285" y1="285.0" x2="335" y2="285.0" class="flow"/>
<line x1="575" y1="285.0" x2="630" y2="285.0" class="flow"/>
<line x1="900" y1="285.0" x2="960" y2="285.0" class="flow"/>
<line x1="1190" y1="285.0" x2="1250" y2="285.0" class="flow"/>
<path d="M1375 390 C1375 490 770 500 770 380" fill="none" stroke="#081B33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<rect x="1110" y="420" width="270" height="90" rx="12" fill="#DDF4F8" stroke="#29A7C8" stroke-width="2"/>
<text x="1245" y="455" class="h" text-anchor="middle">LR SCHEDULE</text>
<text x="1245" y="485" class="s" text-anchor="middle">3–5 epoch warmup + cosine</text>
<line x1="1245" y1="420" x2="1375" y2="380" class="flow"/>
<rect x="35" y="595" width="1530" height="235" rx="12" fill="#FFFFFF" stroke="#AAB3C0" stroke-width="2"/>
<text x="70" y="635" class="h" text-anchor="start">VALIDATION + MODEL SELECTION</text>
<rect x="35" y="680" width="270" height="95" rx="12" fill="#F4F7FA" stroke="#5B6678" stroke-width="2"/>
<text x="170" y="717" class="h" text-anchor="middle">VALIDATION SET</text>
<text x="170" y="748" class="s" text-anchor="middle">held-out data</text>
<rect x="415" y="680" width="270" height="95" rx="12" fill="#F4F7FA" stroke="#5B6678" stroke-width="2"/>
<text x="550" y="717" class="h" text-anchor="middle">VALIDATION LOOP</text>
<text x="550" y="748" class="s" text-anchor="middle">monitor generalization</text>
<rect x="815" y="680" width="270" height="95" rx="12" fill="#F4F7FA" stroke="#5B6678" stroke-width="2"/>
<text x="950" y="717" class="h" text-anchor="middle">CHECKPOINT MANAGER</text>
<text x="950" y="748" class="s" text-anchor="middle">save best validation state</text>
<rect x="1225" y="680" width="270" height="95" rx="12" fill="#F4F7FA" stroke="#5B6678" stroke-width="2"/>
<text x="1360" y="717" class="h" text-anchor="middle">DEPLOYABLE MODEL</text>
<text x="1360" y="748" class="s" text-anchor="middle">selected checkpoint</text>
<line x1="305" y1="727" x2="405" y2="727" class="flow"/>
<line x1="685" y1="727" x2="805" y2="727" class="flow"/>
<line x1="1085" y1="727" x2="1215" y2="727" class="flow"/>
<path d="M770 595 L770 550 L770 380" fill="none" stroke="#5B6678" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="800" y="865" class="s" text-anchor="middle">Solid arrows: data/control flow · Dashed arrows: feedback or parameter update</text>
</svg>