<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Four-stage hierarchy from raw pixels to object recognition</title><desc id="desc">Four-stage hierarchy from raw pixels to object recognition</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#081B33"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#081B33}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#5B6678}.axis{stroke:#5B6678;stroke-width:2}.grid{stroke:#D8DEE8;stroke-width:1}.flow{stroke:#081B33;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.panel{fill:#F4F7FA;stroke:#AAB3C0;stroke-width:2}.module{fill:#E8EEF8;stroke:#263F8F;stroke-width:2}.accent{fill:#DDF4F8;stroke:#238BA8;stroke-width:2}</style></defs>
<rect width="1400" height="620" fill="#FFFFFF"/>
<text x="700" y="55" class="t" text-anchor="middle">Hierarchical Feature Learning</text>
<rect x="55" y="150" width="290" height="320" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="200" y="195" class="h" text-anchor="middle">RAW PIXELS</text>
<text x="200" y="320" class="t" text-anchor="middle">▦</text>
<text x="200" y="420" class="b" text-anchor="middle">image values</text>
<line x1="345" y1="310" x2="390" y2="310" class="flow"/>
<rect x="395" y="150" width="290" height="320" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="540" y="195" class="h" text-anchor="middle">EDGES + GRADIENTS</text>
<text x="540" y="320" class="t" text-anchor="middle">╱ ╲ ─</text>
<text x="540" y="420" class="b" text-anchor="middle">local contrast</text>
<line x1="685" y1="310" x2="730" y2="310" class="flow"/>
<rect x="735" y="150" width="290" height="320" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="880" y="195" class="h" text-anchor="middle">SHAPES + TEXTURES</text>
<text x="880" y="320" class="t" text-anchor="middle">○ △ ≋</text>
<text x="880" y="420" class="b" text-anchor="middle">curves · corners</text>
<line x1="1025" y1="310" x2="1070" y2="310" class="flow"/>
<rect x="1075" y="150" width="290" height="320" rx="12" fill="#DDF4F8" stroke="#263F8F" stroke-width="2"/>
<text x="1220" y="195" class="h" text-anchor="middle">OBJECT-LEVEL</text>
<text x="1220" y="225" class="h" text-anchor="middle">REPRESENTATION</text>
<text x="1220" y="320" class="t" text-anchor="middle">DOG</text>
<text x="1220" y="420" class="b" text-anchor="middle">dog face</text>
<text x="700" y="535" class="b" text-anchor="middle">Each learned representation becomes the input to the next layer.</text>
</svg>