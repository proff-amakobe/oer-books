<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Conceptual training-loss curves under four learning-rate choices</title><desc id="desc">Conceptual training-loss curves under four learning-rate choices</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#081B33"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#081B33}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#5B6678}.axis{stroke:#5B6678;stroke-width:2}.grid{stroke:#D8DEE8;stroke-width:1}.flow{stroke:#081B33;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.panel{fill:#F4F7FA;stroke:#AAB3C0;stroke-width:2}.module{fill:#E8EEF8;stroke:#263F8F;stroke-width:2}.accent{fill:#DDF4F8;stroke:#238BA8;stroke-width:2}</style></defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" class="t" text-anchor="middle">Learning Rate Effects (Illustrative)</text>
<line x1="90" y1="235.0" x2="1310" y2="235.0" class="grid"/>
<line x1="90" y1="360.0" x2="1310" y2="360.0" class="grid"/>
<line x1="90" y1="485.0" x2="1310" y2="485.0" class="grid"/>
<line x1="90" y1="610" x2="1310" y2="610" class="axis"/>
<line x1="90" y1="110" x2="90" y2="610" class="axis"/>
<text x="700.0" y="648" class="s" text-anchor="middle">Training progress</text>
<text x="42" y="360.0" class="s" text-anchor="middle">Loss</text>
<path d="M100 170 C180 210 220 130 300 250 S430 120 510 330 S650 190 730 410 S900 250 1000 520 S1160 390 1290 585" fill="none" stroke="#081B33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M100 170 C280 300 410 420 600 500 S950 565 1290 575" fill="none" stroke="#3157D5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M100 170 C390 230 700 315 1000 405 S1200 455 1290 480" fill="none" stroke="#5B6678" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<path d="M100 170 C160 165 220 190 300 240 C520 430 850 550 1290 580" fill="none" stroke="#29A7C8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<line x1="930" y1="125" x2="980" y2="125" class="axis" style="stroke:#081B33;stroke-width:4"/>
<text x="995" y="131" class="s" text-anchor="start">too high: unstable</text>
<line x1="930" y1="153" x2="980" y2="153" class="axis" style="stroke:#3157D5;stroke-width:4"/>
<text x="995" y="159" class="s" text-anchor="start">just right: steady</text>
<line x1="930" y1="181" x2="980" y2="181" class="axis" style="stroke:#5B6678;stroke-width:4"/>
<text x="995" y="187" class="s" text-anchor="start">too low: slow</text>
<line x1="930" y1="209" x2="980" y2="209" class="axis" style="stroke:#29A7C8;stroke-width:4"/>
<text x="995" y="215" class="s" text-anchor="start">warmup + cosine</text>
</svg>