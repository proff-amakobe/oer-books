<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
<title id="title">Four diagnostic patterns comparing training and validation loss</title><desc id="desc">Four diagnostic patterns comparing training and validation loss</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#081B33"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#081B33}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#5B6678}.axis{stroke:#5B6678;stroke-width:2}.grid{stroke:#D8DEE8;stroke-width:1}.flow{stroke:#081B33;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.panel{fill:#F4F7FA;stroke:#AAB3C0;stroke-width:2}.module{fill:#E8EEF8;stroke:#263F8F;stroke-width:2}.accent{fill:#DDF4F8;stroke:#238BA8;stroke-width:2}</style></defs>
<rect width="1500" height="860" fill="#FFFFFF"/>
<text x="750" y="48" class="t" text-anchor="middle">Reading Training Curves</text>
<rect x="50" y="100" width="680" height="320" rx="12" fill="#FFFFFF" stroke="#AAB3C0" stroke-width="2"/>
<line x1="120" y1="212.5" x2="670" y2="212.5" class="grid"/>
<line x1="120" y1="255.0" x2="670" y2="255.0" class="grid"/>
<line x1="120" y1="297.5" x2="670" y2="297.5" class="grid"/>
<line x1="120" y1="340" x2="670" y2="340" class="axis"/>
<line x1="120" y1="170" x2="120" y2="340" class="axis"/>
<text x="395.0" y="378" class="s" text-anchor="middle"></text>
<text x="72" y="255.0" class="s" text-anchor="middle"></text>
<g transform="translate(50,100)"><path d="M120 130 C260 135 430 138 600 140" fill="none" stroke="#3157D5" stroke-width="5"/><path d="M120 118 C270 122 450 126 600 130" fill="none" stroke="#29A7C8" stroke-width="5" stroke-dasharray="10 6"/></g>
<text x="390" y="135" class="h" text-anchor="middle">UNDERFITTING</text>
<text x="390" y="375" class="s" text-anchor="middle">both losses remain high</text>
<text x="390" y="400" class="s" text-anchor="middle">Response: increase capacity / train longer</text>
<rect x="785" y="100" width="680" height="320" rx="12" fill="#FFFFFF" stroke="#AAB3C0" stroke-width="2"/>
<line x1="855" y1="212.5" x2="1405" y2="212.5" class="grid"/>
<line x1="855" y1="255.0" x2="1405" y2="255.0" class="grid"/>
<line x1="855" y1="297.5" x2="1405" y2="297.5" class="grid"/>
<line x1="855" y1="340" x2="1405" y2="340" class="axis"/>
<line x1="855" y1="170" x2="855" y2="340" class="axis"/>
<text x="1130.0" y="378" class="s" text-anchor="middle"></text>
<text x="807" y="255.0" class="s" text-anchor="middle"></text>
<g transform="translate(785,100)"><path d="M120 130 C260 200 400 245 600 270" fill="none" stroke="#3157D5" stroke-width="5"/><path d="M120 135 C270 195 420 235 600 250" fill="none" stroke="#29A7C8" stroke-width="5" stroke-dasharray="10 6"/></g>
<text x="1125" y="135" class="h" text-anchor="middle">GOOD FIT</text>
<text x="1125" y="375" class="s" text-anchor="middle">both decline and track</text>
<text x="1125" y="400" class="s" text-anchor="middle">Response: retain checkpoint</text>
<rect x="50" y="470" width="680" height="320" rx="12" fill="#FFFFFF" stroke="#AAB3C0" stroke-width="2"/>
<line x1="120" y1="582.5" x2="670" y2="582.5" class="grid"/>
<line x1="120" y1="625.0" x2="670" y2="625.0" class="grid"/>
<line x1="120" y1="667.5" x2="670" y2="667.5" class="grid"/>
<line x1="120" y1="710" x2="670" y2="710" class="axis"/>
<line x1="120" y1="540" x2="120" y2="710" class="axis"/>
<text x="395.0" y="748" class="s" text-anchor="middle"></text>
<text x="72" y="625.0" class="s" text-anchor="middle"></text>
<g transform="translate(50,470)"><path d="M120 130 C270 205 420 250 600 275" fill="none" stroke="#3157D5" stroke-width="5"/><path d="M120 135 C270 200 400 220 600 220" fill="none" stroke="#29A7C8" stroke-width="5" stroke-dasharray="10 6"/></g>
<text x="390" y="505" class="h" text-anchor="middle">MILD OVERFITTING</text>
<text x="390" y="745" class="s" text-anchor="middle">validation plateaus</text>
<text x="390" y="770" class="s" text-anchor="middle">Response: regularize / early stop</text>
<rect x="785" y="470" width="680" height="320" rx="12" fill="#FFFFFF" stroke="#AAB3C0" stroke-width="2"/>
<line x1="855" y1="582.5" x2="1405" y2="582.5" class="grid"/>
<line x1="855" y1="625.0" x2="1405" y2="625.0" class="grid"/>
<line x1="855" y1="667.5" x2="1405" y2="667.5" class="grid"/>
<line x1="855" y1="710" x2="1405" y2="710" class="axis"/>
<line x1="855" y1="540" x2="855" y2="710" class="axis"/>
<text x="1130.0" y="748" class="s" text-anchor="middle"></text>
<text x="807" y="625.0" class="s" text-anchor="middle"></text>
<g transform="translate(785,470)"><path d="M120 130 C270 210 430 260 600 280" fill="none" stroke="#3157D5" stroke-width="5"/><path d="M120 135 C270 205 400 205 600 145" fill="none" stroke="#29A7C8" stroke-width="5" stroke-dasharray="10 6"/></g>
<text x="1125" y="505" class="h" text-anchor="middle">SEVERE OVERFITTING</text>
<text x="1125" y="745" class="s" text-anchor="middle">validation rises</text>
<text x="1125" y="770" class="s" text-anchor="middle">Response: stop and correct overfit</text>
<line x1="560" y1="60" x2="610" y2="60" class="axis" style="stroke:#3157D5;stroke-width:4"/>
<text x="620" y="66" class="s" text-anchor="start">training</text>
<line x1="760" y1="60" x2="810" y2="60" class="axis" style="stroke:#29A7C8;stroke-width:4"/>
<text x="820" y="66" class="s" text-anchor="start">validation</text>
</svg>