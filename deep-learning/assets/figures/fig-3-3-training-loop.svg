<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Four-phase training loop from forward pass through parameter update</title><desc id="desc">Four-phase training loop from forward pass through parameter update</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#081B33"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#081B33}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px;fill:#5B6678}.axis{stroke:#5B6678;stroke-width:2}.grid{stroke:#D8DEE8;stroke-width:1}.flow{stroke:#081B33;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.panel{fill:#F4F7FA;stroke:#AAB3C0;stroke-width:2}.module{fill:#E8EEF8;stroke:#263F8F;stroke-width:2}.accent{fill:#DDF4F8;stroke:#238BA8;stroke-width:2}</style></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="600" y="55" class="t" text-anchor="middle">The Heartbeat of Training</text>
<rect x="430" y="90" width="340" height="130" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="600" y="147" class="h" text-anchor="middle">1  FORWARD PASS</text>
<text x="600" y="183" class="s" text-anchor="middle">inputs → predictions</text>
<rect x="740" y="290" width="340" height="130" rx="12" fill="#DDF4F8" stroke="#263F8F" stroke-width="2"/>
<text x="910" y="347" class="h" text-anchor="middle">2  LOSS COMPUTATION</text>
<text x="910" y="383" class="s" text-anchor="middle">compare predictions to targets</text>
<rect x="430" y="490" width="340" height="130" rx="12" fill="#E8EEF8" stroke="#263F8F" stroke-width="2"/>
<text x="600" y="547" class="h" text-anchor="middle">3  BACKWARD PASS</text>
<text x="600" y="583" class="s" text-anchor="middle">compute gradients by chain rule</text>
<rect x="120" y="290" width="340" height="130" rx="12" fill="#DDF4F8" stroke="#263F8F" stroke-width="2"/>
<text x="290" y="347" class="h" text-anchor="middle">4  PARAMETER UPDATE</text>
<text x="290" y="383" class="s" text-anchor="middle">optimizer adjusts weights</text>
<path d="M770 155 C900 175 980 235 910 290" class="flow"/>
<path d="M910 420 C875 505 790 555 770 555" class="flow"/>
<path d="M430 555 C300 530 230 450 290 420" class="flow"/>
<path d="M290 290 C325 205 415 155 430 155" class="flow"/>
<text x="600" y="360" class="b" text-anchor="middle">repeat for each mini-batch</text>
</svg>