project:
  output-dir: output/reset/pdf
book:
  output-file: Generative-AI-ORIGINAL-MANUSCRIPT-REVIEW
format:
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=0.8in
      - heightrounded
    classoption: [oneside, openany]
    toc: true
    toc-depth: 2
    colorlinks: false
    keep-tex: true
    mainfont: texgyrepagella-regular.otf
    mainfontoptions:
      - BoldFont=texgyrepagella-bold.otf
      - ItalicFont=texgyrepagella-italic.otf
      - BoldItalicFont=texgyrepagella-bolditalic.otf
    sansfont: texgyreheros-regular.otf
    monofont: DejaVuSansMono.ttf
    monofontoptions:
      - Path=output/reset/fonts/
    include-in-header: styles/reset-print.tex
