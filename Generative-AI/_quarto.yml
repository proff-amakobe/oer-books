project:
  type: book
  output-dir: output/html
  render:
    - '*.qmd'
    - chapters/*.qmd
  resources:
    - robots.txt

book:
  title: Generative AI
  subtitle: 'TEMPORARY — pending author approval'
  author: Moody Amakobe
  date: '2026-09-18'
  date-format: YYYY
  description: 'An open textbook on generative AI: language models, prompts, agents, retrieval, customization, research, multimodal systems, evaluation, optimization, safety, ethics, law, and deployment.'
  site-url: https://proff-amakobe.github.io/oer-books/Generative-AI/
  repo-url: https://github.com/proff-amakobe/oer-books
  repo-subdir: Generative-AI
  repo-branch: main
  chapters:
    - index.qmd
    - preface.qmd
    - copyright.qmd
    - acknowledgments.qmd
    - part: Foundations of Generative AI
      chapters:
        - chapters/01-foundations.qmd
        - chapters/02-llms.qmd
        - chapters/03-prompt-engineering.qmd
    - part: Building Generative AI Systems
      chapters:
        - chapters/04-apis-integration.qmd
        - chapters/05-agents.qmd
        - chapters/06-rag.qmd
        - chapters/07-finetuning.qmd
    - part: Research, Modalities, and Evaluation
      chapters:
        - chapters/08-research-methods.qmd
        - chapters/09-multimodal.qmd
        - chapters/10-evaluation.qmd
        - chapters/11-optimization.qmd
    - part: Responsible Generative AI
      chapters:
        - chapters/12-safety-alignment.qmd
        - chapters/13-ethics.qmd
        - chapters/14-law-policy.qmd
    - part: Production and the Frontier
      chapters:
        - chapters/15-deployment-frontier.qmd
    - references.qmd
    - about-author.qmd

lang: en-US
publisher: Global Data Science Institute
edition: First Open Edition
copyright: '© 2026 Moody Amakobe'
license: CC BY 4.0
bibliography: references.bib
nocite: '@*'
number-sections: true
number-depth: 2
execute:
  enabled: false
filters:
  - scripts/technical-blocks.lua
