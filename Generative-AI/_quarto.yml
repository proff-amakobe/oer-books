project:
  type: book
  output-dir: output/reset/html
  render:
  - index.qmd
  - preface.qmd
  - copyright.qmd
  - acknowledgments.qmd
  - original/*.qmd
  - references.qmd
  - about-author.qmd
  resources:
  - robots.txt
  - assets/images/**
  - assets/cover/**
book:
  title: Generative AI
  subtitle: Foundations, Systems, Evaluation, and Responsible Deployment
  author: Moody Amakobe
  date: '2026-09-18'
  date-format: YYYY
  description: 'An open textbook on generative AI: language models, prompts, agents,
    retrieval, customization, research, multimodal systems, evaluation, optimization,
    safety, ethics, law, and deployment.'
  site-url: https://proff-amakobe.github.io/oer-books/Generative-AI/
  repo-url: https://github.com/proff-amakobe/oer-books
  repo-subdir: Generative-AI
  repo-branch: main
  chapters:
  - index.qmd
  - preface.qmd
  - copyright.qmd
  - acknowledgments.qmd
  - part: Foundations of Generative AI
    chapters:
    - original/01-foundations.qmd
    - original/02-llms.qmd
    - original/03-prompt-engineering.qmd
  - part: Building Generative AI Systems
    chapters:
    - original/04-apis-integration.qmd
    - original/05-agents.qmd
    - original/06-rag.qmd
    - original/07-finetuning.qmd
  - part: Research, Modalities, and Evaluation
    chapters:
    - original/08-research-methods.qmd
    - original/09-multimodal.qmd
    - original/10-evaluation.qmd
    - original/11-optimization.qmd
  - part: Responsible Generative AI
    chapters:
    - original/12-safety-alignment.qmd
    - original/13-ethics.qmd
    - original/14-law-policy.qmd
  - part: Production and the Frontier
    chapters:
    - original/15-deployment-frontier.qmd
  - references.qmd
  - about-author.qmd
lang: en-US
publisher: Global Data Science Institute
edition: First Open Edition
copyright: © 2026 Moody Amakobe
license: CC BY 4.0
number-sections: false
execute:
  enabled: false
filters:
- scripts/reset-resources.lua
citeproc: false
