project:
  output-dir: output/reset/html
book:
  search: true
  page-navigation: true
  repo-actions: [source]
  open-graph:
    title: 'Generative AI: Foundations, Systems, Evaluation, and Responsible Deployment'
    image: assets/images/cover.jpg
    description: "An open textbook moving from generative AI foundations to designing, evaluating, governing, and deploying real systems."
  twitter-card:
    card-style: summary_large_image
    image: assets/images/cover.jpg
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: file-pdf
        text: Download review PDF
        href: downloads/Generative-AI-ORIGINAL-MANUSCRIPT-REVIEW.pdf
      - icon: book
        text: Download EPUB
        href: downloads/Generative-AI-ORIGINAL-MANUSCRIPT.epub
  page-footer:
    left: '© 2026 Moody Amakobe · Global Data Science Institute'
    right: '[CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
format:
  html:
    theme:
      light: [cosmo, styles/reset-html.scss]
      dark: [darkly, styles/reset-html.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    include-in-header: styles/book-metadata.html
