project:
  output-dir: output/html
book:
  search: true
  page-navigation: true
  repo-actions: [source]
  open-graph:
    title: 'Generative AI: Foundations, Systems, Evaluation, and Responsible Deployment'
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: file-pdf
        text: Download review PDF
        href: downloads/Generative-AI-PHASE-1B-REVIEW.pdf
      - icon: book
        text: Download EPUB
        href: downloads/Generative-AI.epub
  page-footer:
    left: '© 2026 Moody Amakobe · Global Data Science Institute'
    right: '[CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
format:
  html:
    theme:
      light: [cosmo, styles/html.scss]
      dark: [darkly, styles/html.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    include-in-header: styles/book-metadata.html
